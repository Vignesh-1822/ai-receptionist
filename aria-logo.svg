<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Aria — AI Voice Receptionist logo</title>
  <defs>
    <style>
      @keyframes wave  { 0%,100%{opacity:1} 50%{opacity:0.2} }
      @keyframes wave2 { 0%,100%{opacity:1} 50%{opacity:0.2} }
      @keyframes wave3 { 0%,100%{opacity:1} 50%{opacity:0.2} }
      .w1 { animation: wave  1.6s ease-in-out 0s   infinite; }
      .w2 { animation: wave2 1.6s ease-in-out 0.3s infinite; }
      .w3 { animation: wave3 1.6s ease-in-out 0.6s infinite; }
    </style>
    <linearGradient id="ariaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="120" height="120" rx="26" fill="url(#ariaGrad)"/>

  <!-- Phone handset -->
  <path d="M34 34 Q34 26 42 26 L50 26 Q52 26 53 28 L57 38 Q58 41 55 43 L51 45 Q49 46 49 48 Q50 60 54 66 Q56 68 58 68 L60 64 Q62 61 65 62 L75 66 Q77 67 77 69 L77 77 Q77 85 69 85 L61 85 Q34 85 34 58 Z"
    fill="white" opacity="0.95"/>

  <!-- AI sound waves -->
  <path d="M68 40 Q78 50 68 60" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" class="w1"/>
  <path d="M74 34 Q88 50 74 66" fill="none" stroke="white" stroke-width="2"   stroke-linecap="round" class="w2" opacity="0.7"/>
  <path d="M80 28 Q98 50 80 72" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" class="w3" opacity="0.4"/>

  <!-- AI dot -->
  <circle cx="45" cy="56" r="5" fill="#7c3aed"/>
  <circle cx="45" cy="56" r="2.5" fill="white"/>
</svg>
